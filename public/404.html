<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>p2p-share</title>
    <script>
      fetch("/index.html")
        .then((response) => {
          if (!response.ok) throw new Error("Could not load p2p-share.");
          return response.text();
        })
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
        });
    </script>
  </head>
  <body></body>
</html>
